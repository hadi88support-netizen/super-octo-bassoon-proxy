name: Temporary SOCKS5 Proxy (No Auth Tunnel)

on:
  workflow_dispatch:

jobs:
  start-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dante SOCKS Server & Bore
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server curl
          
          # Install bore (Simple & free TCP tunnel)
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Configure SOCKS5 Server
        run: |
          cat << 'EOF' | sudo tee /etc/danted.conf
          logoutput: stderr
          internal: 0.0.0.0 port = 1080
          external: eth0
          socksmethod: none
          clientmethod: none

          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }

          socks pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }
          EOF

      - name: Start Services & Send Public Address to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_USER: ${{ secrets.WORKER_USER }}
          WORKER_PASS: ${{ secrets.WORKER_PASS }}
        run: |
          # Start Dante SOCKS5
          sudo systemctl restart danted

          # Start Bore TCP Tunnel
          bore local 1080 --to bore.pub > bore.log 2>&1 &
          sleep 5

          # Extract Public TCP Address (e.g. bore.pub:32145)
          PORT=$(grep -oE 'listening at bore.pub:[0-9]+' bore.log | awk -F':' '{print $2}')
          
          if [ -z "$PORT" ]; then
            echo "Bore tunnel failed!"
            cat bore.log
            exit 1
          fi

          PROXY_URL="bore.pub:$PORT"
          echo "Generated TCP Proxy: $PROXY_URL"

          # Clean Endpoint Path
          CLEAN_URL=$(echo "$WORKER_URL" | sed 's/\/*$//')
          if [[ "$CLEAN_URL" != */update ]]; then
            TARGET_ENDPOINT="${CLEAN_URL}/update"
          else
            TARGET_ENDPOINT="$CLEAN_URL"
          fi

          # Send to Cloudflare Worker
          curl -s -X POST "$TARGET_ENDPOINT" \
               -u "$WORKER_USER:$WORKER_PASS" \
               -H "Content-Type: application/json" \
               -d "{\"proxy_url\": \"$PROXY_URL\"}"

      - name: Keep Tunnel Alive
        run: |
          sleep 4h
