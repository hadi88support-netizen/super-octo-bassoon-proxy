name: Temporary SOCKS5 Proxy (No Auth Tunnel)

on:
  workflow_dispatch:

jobs:
  start-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dante SOCKS Server
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server curl

      - name: Configure SOCKS5 Server
        run: |
          cat << 'EOF' | sudo tee /etc/danted.conf
          logoutput: stderr
          internal: 0.0.0.0 port = 1080
          external: eth0
          socksmethod: none
          clientmethod: none

          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }

          socks pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }
          EOF

      - name: Start Services & Send Public Address to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_USER: ${{ secrets.WORKER_USER }}
          WORKER_PASS: ${{ secrets.WORKER_PASS }}
        run: |
          # Start Dante SOCKS5 Proxy
          sudo systemctl restart danted

          # Start Pinggy TCP Tunnel (Strictly TCP for SOCKS5)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:1080 tcp.pinggy.io > pinggy.log 2>&1 &
          sleep 8

          # Parse Host and Port
          PROXY_URL=$(grep -oE '[a-zA-Z0-9.-]+\.a\.pinggy\.io:[0-9]+' pinggy.log | head -n 1)

          if [ -z "$PROXY_URL" ]; then
            echo "Pinggy failed, trying Playit.gg / Fallback TCP..."
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:1080 nokey@localhost.run > lhr.log 2>&1 &
            sleep 8
            PROXY_URL=$(grep -oE '[a-zA-Z0-9.-]+\.lhr\.life:[0-9]+' lhr.log | head -n 1)
          fi

          echo "Generated TCP Proxy: $PROXY_URL"

          # Endpoint Cleaning
          CLEAN_URL=$(echo "$WORKER_URL" | sed 's/\/*$//')
          if [[ "$CLEAN_URL" != */update ]]; then
            TARGET_ENDPOINT="${CLEAN_URL}/update"
          else
            TARGET_ENDPOINT="$CLEAN_URL"
          fi

          # Send to Cloudflare Worker
          curl -s -X POST "$TARGET_ENDPOINT" \
               -u "$WORKER_USER:$WORKER_PASS" \
               -H "Content-Type: application/json" \
               -d "{\"proxy_url\": \"$PROXY_URL\"}"

      - name: Keep Tunnel Alive
        run: |
          sleep 4h
