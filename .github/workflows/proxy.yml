name: Temporary SOCKS5 Proxy (No Auth Tunnel)

on:
  workflow_dispatch:

jobs:
  start-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dante & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server curl jq
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok

      - name: Configure SOCKS5 Server
        run: |
          cat << 'EOF' | sudo tee /etc/danted.conf
          logoutput: stderr
          internal: 0.0.0.0 port = 1080
          external: eth0
          socksmethod: none
          clientmethod: none

          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }

          socks pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }
          EOF

      - name: Start Services & Send Public Address to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_USER: ${{ secrets.WORKER_USER }}
          WORKER_PASS: ${{ secrets.WORKER_PASS }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # Start Dante SOCKS5
          sudo systemctl restart danted

          # Start Ngrok TCP Tunnel
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          ngrok tcp 1080 --log=stdout > ngrok.log 2>&1 &
          sleep 5

          # Extract TCP Address via Ngrok Local API
          PROXY_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' | sed 's/tcp:\/\///')

          if [ -z "$PROXY_URL" ] || [ "$PROXY_URL" == "null" ]; then
            echo "Ngrok failed to start!"
            cat ngrok.log
            exit 1
          fi

          echo "Generated TCP Proxy: $PROXY_URL"

          # Endpoint Formatting
          CLEAN_URL=$(echo "$WORKER_URL" | sed 's/\/*$//')
          if [[ "$CLEAN_URL" != */update ]]; then
            TARGET_ENDPOINT="${CLEAN_URL}/update"
          else
            TARGET_ENDPOINT="$CLEAN_URL"
          fi

          # Send to Worker
          curl -s -X POST "$TARGET_ENDPOINT" \
               -u "$WORKER_USER:$WORKER_PASS" \
               -H "Content-Type: application/json" \
               -d "{\"proxy_url\": \"$PROXY_URL\"}"

      - name: Keep Tunnel Alive
        run: |
          sleep 4h
