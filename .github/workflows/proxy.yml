name: Temporary SOCKS5 Proxy (No Auth Tunnel)

on:
  workflow_dispatch:

jobs:
  start-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dante & LocalTunnel
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server curl
          sudo npm install -g localtunnel

      - name: Configure SOCKS5 Server
        run: |
          cat << 'EOF' | sudo tee /etc/danted.conf
          logoutput: stderr
          internal: 0.0.0.0 port = 1080
          external: eth0
          socksmethod: none
          clientmethod: none

          client pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }

          socks pass {
              from: 0.0.0.0/0 to: 0.0.0.0/0
              log: connect disconnect error
          }
          EOF

      - name: Start Services & Send Public Address to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_USER: ${{ secrets.WORKER_USER }}
          WORKER_PASS: ${{ secrets.WORKER_PASS }}
        run: |
          # Start Dante SOCKS5 Proxy
          sudo systemctl restart danted

          # Start LocalTunnel for port 1080
          lt --port 1080 > lt.log 2>&1 &
          sleep 5

          # Extract URL from logs
          PROXY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' lt.log | head -n 1 | sed 's/https:\/\///')

          if [ -z "$PROXY_URL" ]; then
            echo "LocalTunnel failed, trying SSH fallback..."
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -R 80:localhost:1080 nokey@localhost.run > lhr.log 2>&1 &
            sleep 5
            PROXY_URL=$(grep -oE '[a-zA-Z0-9.-]+\.lhr\.life' lhr.log | head -n 1)
          fi

          echo "Generated Public Proxy: $PROXY_URL"

          # Send to Cloudflare Worker
          curl -s -X POST "$WORKER_URL" \
               -u "$WORKER_USER:$WORKER_PASS" \
               -H "Content-Type: application/json" \
               -d "{\"proxy_url\": \"$PROXY_URL\"}"

      - name: Keep Tunnel Alive
        run: |
          sleep 4h
